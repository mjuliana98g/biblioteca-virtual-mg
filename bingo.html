<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Literário - MG</title>
    <link rel="icon" href="img/favicon-matilde-gomes.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@600;700&family=Lora:ital,wght@1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/bingoLiterario/principalBingo.js"></script>
</head>

<body class="pagina-bingo">
    <a href="index.html" id="botao-voltar">← Biblioteca</a>
    <button type="button" id="botao-tema" aria-label="Mudar para modo escuro">⏾</button>

    <main>
        <section id="zona-do-jogo" aria-labelledby="titulo-bingo">
            <section id="cartao-bingo">
                <header>
                    <p id="informacao-cartao">Cartão n.º 1 · iniciado a 07/10</p>
                    <h1 id="titulo-bingo">Bingo Literário</h1>
                </header>
                <p id="progresso-bingo">0 de 9 desafios cumpridos</p>
                <progress id="barra-bingo" value="0" max="9" aria-labelledby="progresso-bingo"></progress>
                <ol id="cartela-bingo">
                                        <li><button type="button" class="quadrado-bingo categoria-formato"><small class="coordenada">A1</small>Mais de 5⃣00 Páginas</button></li>
                    <li><button type="button" class="quadrado-bingo categoria-historia"><small class="coordenada">B1</small>Livro de uma Saga</button></li>
                    <li><button type="button" class="quadrado-bingo categoria-autoria"><small class="coordenada">C1</small>Autor Português</button></li>
                    <li><button type="button" class="quadrado-bingo categoria-formato"><small class="coordenada">A2</small>Capa Azul</button></li>
                    <li><button type="button" class="quadrado-bingo categoria-historia"><small class="coordenada">B2</small>Fantasia ✧˖°</button></li>
                    <li><button type="button" class="quadrado-bingo categoria-formato"><small class="coordenada">C2</small>Título com ➀ Palavra</button></li>
                    <li><button type="button" class="quadrado-bingo categoria-autoria"><small class="coordenada">A3</small>★★★★★</button></li>
                    <li><button type="button" class="quadrado-bingo categoria-formato"><small class="coordenada">B3</small>Livro em inglês</button></li>
                    <li><button type="button" class="quadrado-bingo categoria-autoria"><small class="coordenada">C3</small>Releitura</button></li>
                </ol>
                <button type="button" id="botao-novo-cartao">Sortear novo cartão</button>
            </section>

            <aside id="livros-do-cartao" aria-label="Livros que cumprem desafios">
                <ul id="lista-livros-do-cartao">
                    <li><img src="img/sem-capa.svg" alt="Capa do livro Casa de Terra e Sangue"><strong>Casa de Terra e Sangue</strong><small class="etiqueta-quadrado">A1</small></li>
                    <li><img src="img/sem-capa.svg" alt="Capa do livro Strange the Dreamer"><strong>Strange the Dreamer</strong><small class="etiqueta-quadrado">B1</small></li>
                </ul>
            </aside>
        </section>
    </main>

    <footer>
        <p>Biblioteca Virtual · Projeto de JavaScript · <time datetime="2026">2026</time></p>
        <p><a href="https://github.com/mjuliana98g/biblioteca-virtual-mg">Código no GitHub</a></p>
    </footer>
</body>

</html>
